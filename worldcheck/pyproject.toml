[project]
name = "worldcheck"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1",
    "transformers==4.57.6",
    "numpy==2.2.6",
    "accelerate==1.12.0",
    "bitsandbytes==0.50.2",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
